name: Update Army Pubs Dashboard

# When this runs:
#  - every day on a schedule (time is in UTC)
#  - whenever you click "Run workflow" by hand
#  - whenever you edit pubs.txt or the script on GitHub
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC each day (about 6 AM Colorado time)
  workflow_dispatch:
  push:
    paths:
      - "pubs.txt"
      - "army_pubs_dashboard.py"
      - "notify_url.txt"
      - ".github/workflows/dashboard.yml"

# Let the job save the rebuilt page back into the repository.
permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the libraries
        run: pip install requests beautifulsoup4

      - name: Build the dashboard page
        run: python army_pubs_dashboard.py --out index.html

      - name: Publish the updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pubs_state.json
          git diff --staged --quiet || git commit -m "Update dashboard ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
